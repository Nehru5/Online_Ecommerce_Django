<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;margin: 0;
    }
    .navbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 75px;
      width: 100%;
      background-color: blueviolet;
      color: white;
    }
    .right{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 30%;
    }

    .container{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      margin-top: 20px;

    }
    .products{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      flex-direction: column;
      box-shadow: 0 0 10px black;
      padding: 10px;
      border-radius: 20px;
    }
    .products button{
      height: 30px;
      width: 50%;
      margin-top: 20px;
      background-color: blueviolet;
      color: white;
      font-weight: bolder;
      border: none;
      padding: 5px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="navbar">

    <div class="left">
      <h2>LOGO</h2>
    </div>

    <div class="right">
      <a href="{% url 'logout_link' %}"><button>Logout</button></a>
      <a href="{% url 'order_list_link' %}"><h2>Orders</h2></a>
      <a href="{% url 'profile_link' %}"><h2>Profile</h2></a>
    </div>

  </div>

  <center><h1>Welcome to Dashboard</h1></center>

<div class="container">
    {% for i in products %}
    <div class="products">
      <img src="{{i.product_image.url}}" height="250px" width="200px" alt="">
    <a href="{% url 'product_details_link' i.id %}"><button>View</button></a>
    </div>
  {% endfor %}
</div>
</body>
</html>
